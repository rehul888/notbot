<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Mini App</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the app paints with system fonts and swaps in DM Sans / Space Grotesk when they arrive -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600..700&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600..700&display=swap" /></noscript>
    <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
    <!-- Start /api/me now; the app picks this request up instead of waiting for the bundle -->
    <script>
      (function () {
        try {
          var w = window.Telegram && window.Telegram.WebApp;
          if (w && w.initData) window.__mePromise = fetch("/api/me", { headers: { authorization: "tma " + w.initData } });
        } catch (e) {}
      })();
    </script>
    <!-- Before first paint: theme, inside-Telegram flag and device class (CSS reads data-theme, data-tg, data-perf) -->
    <script>
      (function () {
        var d = document.documentElement, w = window.Telegram && window.Telegram.WebApp, n = navigator;
        try {
          d.dataset.theme = (w && w.colorScheme) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          if (w && w.initData) d.setAttribute("data-tg", "");
          var ua = n.userAgent || "", m = /Telegram-Android\/[\d.]+ \(.*;\s*(LOW|AVERAGE|HIGH)\)/i.exec(ua), low;
          if (m) low = m[1].toUpperCase() !== "HIGH";
          else if (/iPhone|iPad|iPod/.test(ua) || (w && w.platform === "ios")) low = false;
          else low = (n.hardwareConcurrency || 8) <= 4 || (n.deviceMemory || 8) <= 3;
          d.dataset.perf = low ? "low" : "high";
        } catch (e) {}
      })();
    </script>
    <!-- The owner's brand colors and name from the last visit: no color flash while the app loads (src/theme.ts keeps it fresh) -->
    <script>
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem("np_brand_css") || "null");
          if (!c || typeof c.css !== "string") return;
          var s = document.createElement("style");
          s.id = "brand-theme";
          s.textContent = c.css;
          document.head.appendChild(s);
          if (c.name) document.title = c.name;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
