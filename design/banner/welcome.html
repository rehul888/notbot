<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:900px;overflow:hidden}
body{position:relative;background:radial-gradient(900px 700px at 78% 30%,#4a7bff 0%,#2457ff 55%,#1c47e0 100%);font-family:'DM Sans',sans-serif;color:#fff}
.ring{position:absolute;border:6px dashed rgba(255,255,255,.16);border-radius:50%}
.r1{width:980px;height:980px;right:-300px;top:-90px}
.r2{width:560px;height:560px;left:-220px;bottom:-250px;border-width:4px;border-color:rgba(255,255,255,.1)}
.dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.35)}
.brand{position:absolute;left:84px;top:84px;display:flex;align-items:center;gap:26px}
.mark{width:120px;height:120px;border-radius:50%;border:7px solid #fff;display:block;box-sizing:content-box;margin:-7px}
.word{font:700 116px/1 'Space Grotesk',sans-serif;letter-spacing:-4px;margin-left:8px}
.tag{position:absolute;left:84px;top:300px;width:540px;font:700 56px/1.12 'DM Sans',sans-serif;letter-spacing:-1px}
.chips{position:absolute;left:84px;top:520px;width:520px;display:flex;flex-wrap:wrap;gap:16px}
.chip{background:#fff;color:#2457ff;font:700 32px/1 'DM Sans';padding:16px 30px;border-radius:99px;box-shadow:4px 6px 0 rgba(10,24,90,.3)}
.stars{position:absolute;left:84px;bottom:78px;font:500 30px 'DM Sans';opacity:.75}
.s{position:absolute;background:#fff;border-radius:36px;box-shadow:10px 14px 0 rgba(10,24,90,.35);display:flex;align-items:center;justify-content:center;border:4px solid #152044}
.s img{width:58%;height:58%}
.t{font:700 54px 'Space Grotesk'}
</style></head><body>
