<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{position:relative;background:radial-gradient(900px 700px at 78% 30%,#4a7bff 0%,#2457ff 55%,#1c47e0 100%);font-family:'DM Sans',sans-serif;color:#fff}
.ring{position:absolute;border:6px dashed rgba(255,255,255,.16);border-radius:50%}
.r1{width:900px;height:900px;right:-300px;top:-90px}
.r2{width:520px;height:520px;left:-220px;bottom:-250px;border-width:4px;border-color:rgba(255,255,255,.1)}
.dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.35)}
.brand{position:absolute;left:84px;top:170px;display:flex;align-items:center;gap:24px}
.mark{width:130px;height:130px;border-radius:50%;border:7px solid #fff;display:block;box-sizing:content-box;margin:-7px}
.word{font:700 106px/1 'Space Grotesk',sans-serif;letter-spacing:-3.5px;margin-left:8px}
.ic{position:absolute;left:84px;top:350px;display:flex;gap:14px}.ic span{background:#fff;width:100px;height:82px;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:4px 6px 0 rgba(10,24,90,.3)}
.s{position:absolute;background:#fff;border-radius:36px;box-shadow:10px 14px 0 rgba(10,24,90,.35);display:flex;align-items:center;justify-content:center;border:4px solid #152044}
.s img{width:58%;height:58%}
</style></head><body>
